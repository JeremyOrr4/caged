name: pr-policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev, main]

permissions:
  contents: read

jobs:
  pr-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$BASE" = main ]; then
            if [ "$HEAD_REPO" != "$BASE_REPO" ] || { [ "$HEAD" != dev ] && [[ "$HEAD" != hotfix/* ]]; }; then
              echo "PRs into main must come from dev (release) or hotfix/* (patch); target dev instead"
              exit 1
            fi
          fi
          if [ "$BASE" = dev ] && [ "$HEAD" = main ]; then
            echo "PRs into dev must not come from main; dev only accepts squash merges"
            exit 1
          fi
