name: release

# Runs when a maintainer pushes a tag. Tags are created by hand (see
# docs/releasing.md); a ruleset restricts who can create them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release and upload the archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag's commit is on the right branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-rc.*) branch=origin/dev ;;
            *) branch=origin/main ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
            echo "tag $TAG is not reachable from $branch; release tags must be cut from main, and -rc tags from dev"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the check and release tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/goreleaser/goreleaser/v2@v2.18.3
      - name: Check
        run: make check
      - name: Extract the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; found = index($0, "[" v "]") > 0; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean --release-notes release-notes.md
