name: image

# Builds the real runtime image on amd64 and arm64. It is not a required check:
# the installers are unpinned downloads from third parties, so it fails when
# upstream breaks, not when a PR is wrong. The weekly run is the early warning.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - "internal/images/**"
      - ".github/workflows/image.yml"

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build caged
        run: go build -o caged ./cmd/caged
      - name: Build the runtime image
        run: ./caged build
      - name: Check that every CLI reported a version
        run: |
          docker run --rm --entrypoint cat caged-runtime:latest /opt/caged/versions | tee versions.txt
          if grep -q '=unknown$' versions.txt; then
            echo "a CLI did not report a version"
            exit 1
          fi
