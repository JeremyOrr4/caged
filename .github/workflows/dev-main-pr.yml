name: dev-to-main-pr

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dev-to-main-pr
  cancel-in-progress: false

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ahead_by=$(gh api "repos/$GH_REPO/compare/main...dev" --jq '.ahead_by')
          if [ "$ahead_by" = "0" ]; then
            echo "dev has no commits ahead of main; no PR needed"
            exit 0
          fi

          existing=$(gh pr list --state open --base main --head dev --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Release PR #$existing is already open and will include the latest dev changes"
            exit 0
          fi

          gh pr create \
            --base main \
            --head dev \
            --title "Release: dev to main" \
            --body "Automated release PR from \`dev\` to \`main\`. Merge this PR with a merge commit."
