name: update caged formula

on:
  repository_dispatch:
    types: [caged_release]
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: caged-formula-update
  cancel-in-progress: false

jobs:
  update-formula:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the tap default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          if [ "$GITHUB_REF" != "refs/heads/$default_branch" ]; then
            echo "formula updates must run from the tap default branch ($default_branch)" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Calculate formula for newest stable release
        id: formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/JeremyOrr4/caged/releases/latest --jq .tag_name)"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "latest caged release is not a stable semver tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          current=""
          if [ -f Formula/caged.rb ]; then
            current="$(sed -n 's/^  version "\([^"]*\)"$/\1/p' Formula/caged.rb)"
          fi
          if [ -n "$current" ]; then
            update="$(python3 - "$current" "$version" <<'PY'
          import sys
          old = tuple(map(int, sys.argv[1].split(".")))
          new = tuple(map(int, sys.argv[2].split(".")))
          print("true" if new > old else "false")
          PY
            )"
            if [ "$update" = false ]; then
              echo "update=false" >> "$GITHUB_OUTPUT"
              echo "tap formula is already current"
              exit 0
            fi
          fi

          mkdir -p Formula
          archive="$(mktemp)"
          curl --fail --location --silent --show-error \
            "https://github.com/JeremyOrr4/caged/archive/refs/tags/$tag.tar.gz" \
            --output "$archive"
          sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          rm -f "$archive"
          cat > Formula/caged.rb <<EOF
          class Caged < Formula
            desc "Run coding agents in isolated containers"
            homepage "https://github.com/JeremyOrr4/caged"
            url "https://github.com/JeremyOrr4/caged/archive/refs/tags/$tag.tar.gz"
            sha256 "$sha"
            version "$version"
            license "MIT"

            depends_on "go" => :build

            def install
              system "go", "build", *std_go_args(ldflags: "-X main.version=#{version}"), "./cmd/caged"
            end

            test do
              assert_match "caged version #{version}", shell_output("#{bin}/caged --version")
            end
          end
          EOF
          echo "update=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check formula style and audit
        if: steps.formula.outputs.update == 'true'
        run: |
          brew tap jeremyorr4/tap "$GITHUB_WORKSPACE"
          tap_dir="$(brew --repository jeremyorr4/tap)"
          mkdir -p "$tap_dir/Formula"
          cp Formula/caged.rb "$tap_dir/Formula/caged.rb"
          brew style --formula caged
          if git log --all --oneline -- Formula/caged.rb | grep -q .; then
            brew audit --strict --online jeremyorr4/tap/caged
          else
            brew audit --strict --new --online jeremyorr4/tap/caged
          fi

      - name: Build and test formula from source
        if: steps.formula.outputs.update == 'true'
        env:
          VERSION: ${{ steps.formula.outputs.version }}
        run: |
          brew install --build-from-source jeremyorr4/tap/caged
          brew test caged
          test "$(caged --version)" = "caged version $VERSION"

      - name: Commit validated formula
        if: steps.formula.outputs.update == 'true'
        env:
          TAG: ${{ steps.formula.outputs.tag }}
          VERSION: ${{ steps.formula.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/caged.rb
          git commit -m "chore(formula): update caged to $VERSION"
          git push
