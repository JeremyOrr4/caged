version: 2
project_name: caged

builds:
  - id: caged
    main: ./cmd/caged
    binary: caged
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: caged
    formats: [tar.gz]
    name_template: "caged_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^Merge '
      - '^docs:'
      - '^chore:'
      - '^ci:'
      - '^test:'
      - '^build:'
      - '^refactor:'
      - '^style:'
      - '^revert:'
  groups:
    - title: Features
      regexp: '^feat(\([^)]+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\([^)]+\))?!?:'
      order: 1
    - title: Performance improvements
      regexp: '^perf(\([^)]+\))?!?:'
      order: 2
    - title: Other changes
      order: 999

release:
  draft: true
  replace_existing_draft: true
  mode: replace
